# Tier-2 anywhere pipeline: BC bootstrap on the sampled train bank, then RL with
# delivery shaping, then consolidation with class-stratified self-imitation.
# Bank: ~450 train / ~120 eval variants, stratified over distance classes 1-10
# (single-arm target 2, handoff target 1).
# Run: `just train-tier2`

[run]
levels          = ["tier2_anywhere/train"]
eval_levels     = ["tier2_anywhere/eval"]
seed            = 0
device          = "cuda" # force cuda
autodiscovery   = 5      # new family: keep a real BC seed on top of the warm start
# Warm start (stage-4 primary run): tier-1 canonical curriculum best checkpoint.
init_from       = "runs/20261114-232314-783352-tier1_simple_arms_train-tier1_simple_arms-lr0001-ent005-sh5-ent001/best_eval.pt"

[[stage]]
name                = "bc"
kind                = "pretrain"
epochs              = 100  # autodiscovery=5 scales this to 56
lr                  = 1e-3
batch_size          = 32
augment             = true
max_variants        = 16
eval_interval       = 5
early_stop_loss     = 0.5 # prevent overfit

[[stage]]
name                = "rl-shape"
kind                = "rl"
iterations          = 400
episodes            = 32
lr                  = 1e-4
entropy_coef        = 0.005
shaping_weight      = 0.5 # delivery-fraction shaping on unsolved COMPLETED
progress_weight     = 0.3

[[stage]]
name                = "rl-consolidate"
kind                = "rl"
iterations          = 2000        # ceiling, not target
episodes            = 32
lr                  = 1e-4
entropy_coef        = 0.001
shaping_weight      = 0.0         # solve reward only
sil_coef            = 0.4
sil_batch_size      = 32
sil_weighting       = "stratify"  # half the replay from handoff-class solves
eval_patience       = 20          # ~200 iterations without eval-bank improvement ends the stage
# alpha/beta/gamma stay 0, epsilon 0, temperature 1
