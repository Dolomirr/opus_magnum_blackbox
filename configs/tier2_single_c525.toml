# Stage R2 — tier-2 single parity anchor: the dial5 m256 anchor recipe (the run that
# produced the standing 0.962 held-out ruler) with the stage-D feeding mode declared
# explicitly. `bc_cycle = 525` equals the bank size, which degenerates to static
# full-feed (the knob is inert at bank size), so this run is behavior-identical to
# `configs/tier2_single_dial5.toml`; it sanity-anchors the recipe against the standing
# best. First attempt copied the 128d curriculum-split config instead and reproduced its
# 0.43 bit-identically — mechanics proven, wrong ruler.
# Run: `just run-file configs/tier2_single_c525.toml`

[run]
levels          = ["tier2_single/train"]
eval_levels     = ["tier2_single/eval"]
seed            = 0
device          = "cuda" # force cuda
autodiscovery   = 5      # the R2 supervision level: 111 effective BC epochs

[run.model]
d_model         = 256
nhead           = 8
encoder_layers  = 3
decoder_layers  = 3
dim_feedforward = 1024

[[stage]]
name                = "bc"
kind                = "pretrain"
epochs              = 200  # autodiscovery=5 scales this to 111
lr                  = 1e-4 # validated m256 BC step
batch_size          = 32
augment             = true
max_variants        = 16
bc_cycle            = 525  # full-budget cycled = degenerate static full-feed (parity with tier2_single_dial5.toml)
eval_interval       = 5
early_stop_loss     = 0.5  # prevent overfit

[[stage]]
name                = "rl-shape"
kind                = "rl"
iterations          = 400
episodes            = 32
lr                  = 1e-4
entropy_coef        = 0.005
shaping_weight      = 0.5 # delivery-fraction shaping on unsolved COMPLETED
progress_weight     = 0.3

[[stage]]
name                = "rl-consolidate"
kind                = "rl"
iterations          = 3000        # ceiling, not target
episodes            = 32
lr                  = 1e-4
entropy_coef        = 0.001
shaping_weight      = 0.0         # solve reward only
sil_coef            = 0.4
sil_batch_size      = 32
sil_weighting       = "stratify"
sil_label           = "ring"      # half the replay from non-`arm` (length-rare) solves
eval_patience       = 40          # ~400 iterations without eval-bank improvement ends the stage
# alpha/beta/gamma stay 0, epsilon 0, temperature 1
