# Tier-2 anywhere pipeline, from zero: same curriculum as `tier2_anywhere.toml`
# Run: `uv run opus-magnum-blackbox run configs/tier2_retrain.toml`

[run]
levels          = ["tier2_anywhere/train"]
eval_levels     = ["tier2_anywhere/eval"]
seed            = 0
device          = "cuda" # force cuda
autodiscovery   = 5      # new family: keep a real BC seed

[profile]
enabled = true

[[stage]]
name                = "bc"
kind                = "pretrain"
epochs              = 100  # autodiscovery=5 scales this to 56
lr                  = 1e-3
batch_size          = 32
augment             = true
max_variants        = 16
eval_interval       = 5
early_stop_loss     = 0.5 # prevent overfit

[[stage]]
name                = "rl-shape"
kind                = "rl"
iterations          = 400
episodes            = 32
lr                  = 1e-4
entropy_coef        = 0.005
shaping_weight      = 0.5 # delivery-fraction shaping on unsolved COMPLETED
progress_weight     = 0.3

[[stage]]
name                = "rl-consolidate"
kind                = "rl"
iterations          = 2000        # ceiling, not target
episodes            = 32
lr                  = 1e-4
entropy_coef        = 0.001
shaping_weight      = 0.0         # solve reward only
sil_coef            = 0.4
sil_batch_size      = 32
sil_weighting       = "stratify"  # half the replay from handoff-class solves
eval_patience       = 20          # ~200 iterations without eval-bank improvement ends the stage
# alpha/beta/gamma stay 0, epsilon 0, temperature 1
