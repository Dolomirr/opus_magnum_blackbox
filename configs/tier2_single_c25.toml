# BC cycling arm of the bank-size sweep: instead of a fixed 131-level subsample,
# a fresh seeded 131-level subset of the full 525-level tier2_single/train bank is
# supervised every epoch (same per-epoch budget as the static s25 arm, but over 111
# epochs the model sees nearly all 525 distinct pairs). Held-out ruler: the complete
# tier2_single/eval bank; static 131 -> 0.076, static 525 -> 0.962.
# Run: `just run-file configs/tier2_single_c25.toml`

[run]
levels          = ["tier2_single/train"]
eval_levels     = ["tier2_single/eval"]
seed            = 0
device          = "cuda" # force cuda
autodiscovery   = 5

[run.model]
d_model         = 256
nhead           = 8
encoder_layers  = 3
decoder_layers  = 3
dim_feedforward = 1024

[[stage]]
name                = "bc"
kind                = "pretrain"
epochs              = 200
lr                  = 1e-4
batch_size          = 32
augment             = true
max_variants        = 16
bc_cycle            = 131
eval_interval       = 5
early_stop_loss     = 0.5

[[stage]]
name                = "rl-shape"
kind                = "rl"
iterations          = 400
episodes            = 32
lr                  = 1e-4
entropy_coef        = 0.005
shaping_weight      = 0.5
progress_weight     = 0.3

[[stage]]
name                = "rl-consolidate"
kind                = "rl"
iterations          = 3000
episodes            = 32
lr                  = 1e-4
entropy_coef        = 0.001
shaping_weight      = 0.0
sil_coef            = 0.4
sil_batch_size      = 32
sil_weighting       = "stratify"
sil_label           = "ring"
eval_patience       = 40
