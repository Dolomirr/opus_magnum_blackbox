# Procedural BC confirmation, run A: solver-fed BC over the full 525-pair train space.
# Identical to `configs/tier2_single_dial5.toml` except the BC source: each BC epoch
# samples `bc_cycle` fresh (E, X) pairs from the procedural pool, solves them with the
# anywhere solver, and supervises reference + augmented variants — no materialized
# train solutions are read (the train bank below is only the RL stages' rollout bank).
# Expect ≈ the cycled-bank result (~0.95 held-out) if the procedural source works
# end-to-end. Run: `just run-file configs/tier2_single_pfull.toml`

[run]
levels          = ["tier2_single/train"]
eval_levels     = ["tier2_single/eval"]
seed            = 0
device          = "cuda" # force cuda
autodiscovery   = 5      # the R2 supervision level: 111 effective BC epochs

[run.model]
d_model         = 256
nhead           = 8
encoder_layers  = 3
decoder_layers  = 3
dim_feedforward = 1024

[[stage]]
name                = "bc"
kind                = "pretrain"
epochs              = 200  # autodiscovery=5 scales this to 111
lr                  = 1e-4 # validated m256 BC step
batch_size          = 32
augment             = true
max_variants        = 16
eval_interval       = 5
early_stop_loss     = 0.5  # prevent overfit
bc_source           = "procedural"
procedural_pool     = "full" # all 525 train pairs; the 131 eval pairs are excluded by construction
bc_cycle            = 131    # fresh solver-fed instances per epoch

[[stage]]
name                = "rl-shape"
kind                = "rl"
iterations          = 400
episodes            = 32
lr                  = 1e-4
entropy_coef        = 0.005
shaping_weight      = 0.5 # delivery-fraction shaping on unsolved COMPLETED
progress_weight     = 0.3

[[stage]]
name                = "rl-consolidate"
kind                = "rl"
iterations          = 3000        # ceiling, not target
episodes            = 32
lr                  = 1e-4
entropy_coef        = 0.001
shaping_weight      = 0.0         # solve reward only
sil_coef            = 0.4
sil_batch_size      = 32
sil_weighting       = "stratify"
sil_label           = "ring"      # half the replay from non-`arm` (length-rare) solves
eval_patience       = 40          # ~400 iterations without eval-bank improvement ends the stage
# alpha/beta/gamma stay 0, epsilon 0, temperature 1
