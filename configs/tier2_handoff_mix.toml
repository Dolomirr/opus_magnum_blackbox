# Tier-2 curriculum split, round 2 stage R3: stage B with rehearsal (mixed diet).
# Round 1's handoff-only BC wiped stage A's skill (best checkpoint: 20/121 handoff,
# 0/131 single). The fix is baking rehearsal into BOTH phases: levels are the handoff
# and single train banks together (~50/50), and `sil_label = "handoff"` concentrates
# the replay share on the handoff class. Eval covers BOTH banks — forgetting is
# measured and should now be prevented.
# Warm start: round-2 stage R2 winner (m256, single-bank eval 0.962) — the R1/R2
# comparison picked the big model, so the same `[run] model` table is mandatory here
# (warm-start mismatch is a hard error).
# BC deviates from round 1's recipe on purpose: its lr 1e-3 diverged at 2x width
# (round 1 m256 arm; R2's 3e-4 rerun still drifted after epoch 15). This config uses
# R2's validated m256 BC recipe instead: lr 1e-4, 200 epochs -> 111 effective.
# Run: `just run-file configs/tier2_handoff_mix.toml`

[run]
levels          = ["tier2_handoff/train", "tier2_single/train"]
eval_levels     = ["tier2_single/eval", "tier2_handoff/eval"]
seed            = 0
device          = "cuda" # force cuda
autodiscovery   = 5      # new family: keep a real BC seed on top of the warm start
# Warm start: stage R2 (`configs/tier2_single_big2.toml`) best checkpoint, eval 0.962:
init_from       = "runs/20261115-235504-849534-tier2_single_train-tier2_single_big2-ad5-m256-lr0001-ent005-sh5-pg3-ent001-sil4-silb32-silwstratify-sillring/best_eval.pt"

[run.model]
d_model         = 256
nhead           = 8
encoder_layers  = 3
decoder_layers  = 3
dim_feedforward = 1024

[[stage]]
name                = "bc"
kind                = "pretrain"
epochs              = 200  # autodiscovery=5 scales this to 111
lr                  = 1e-4 # validated m256 BC step (1e-3 diverges at 2x width)
batch_size          = 32
augment             = true
max_variants        = 16
eval_interval       = 5
early_stop_loss     = 0.5  # prevent overfit

[[stage]]
name                = "rl-shape"
kind                = "rl"
iterations          = 400
episodes            = 32
lr                  = 1e-4
entropy_coef        = 0.005
shaping_weight      = 0.5 # delivery-fraction shaping on unsolved COMPLETED
progress_weight     = 0.3

[[stage]]
name                = "rl-consolidate"
kind                = "rl"
iterations          = 3000        # ceiling, not target
episodes            = 32
lr                  = 1e-4
entropy_coef        = 0.001
shaping_weight      = 0.0         # solve reward only
sil_coef            = 0.4
sil_batch_size      = 32
sil_weighting       = "stratify"
sil_label           = "handoff"   # half the replay from two-arm (handoff) solves
eval_patience       = 40          # ~400 iterations without eval-bank improvement ends the stage
# alpha/beta/gamma stay 0, epsilon 0, temperature 1
