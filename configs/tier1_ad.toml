# Tier-1 autodiscovery sweep template, consumed only by `just train-tier1-ad k`:
# the recipe substitutes the k parameter and writes the copy to runs/tier1_ad<k>.toml.
# Otherwise identical to configs/tier1_simple_arms.toml (same bank, seed, stages);
# the dial scales every pretrain stage's epochs to round(epochs * (10 - k) / 9),
# and the run dir gets an -ad<k> suffix. The existing k=1 baseline run is the
# comparison point, do not rerun it.

[run]
levels          = ["tier1_simple_arms/train"]
eval_levels     = ["tier1_simple_arms/eval"]
seed            = 0
device          = "cuda" # force cuda
autodiscovery   = %@

[[stage]]
name                = "bc"
kind                = "pretrain"
epochs              = 100 # scaled by the dial: k=1 keeps 100, k=10 skips the stage
lr                  = 1e-3
batch_size          = 32
augment             = true
max_variants        = 16
eval_interval       = 5
early_stop_loss     = 0.5 # prevent overfit

[[stage]]
name          = "rl-shape"
kind          = "rl"
iterations    = 400
episodes      = 32
lr            = 1e-4
entropy_coef  = 0.005
shaping_weight = 0.5 # delivery-fraction shaping on unsolved COMPLETED

[[stage]]
name                = "rl-consolidate"
kind                = "rl"
iterations          = 3000 # ceiling, not target
episodes            = 32
lr                  = 1e-4
entropy_coef        = 0.001
shaping_weight      = 0.0   # solve reward only
eval_patience       = 20    # ~200 iterations without eval-bank improvement ends the stage
# alpha/beta/gamma stay 0
