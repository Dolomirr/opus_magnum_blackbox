# E-b bootstrap dial, k=9: how much of the single-bank result survives on 22 BC epochs?
# Identical to the round-2 R2 recipe (`configs/tier2_single_big2.toml`, m256, fresh,
# single bank) except `autodiscovery = 9` — BC epochs scale round(200 * (10-9)/9) = 22.
# No `skip_when_bc_eval_gte` here on purpose: the dial must measure whether the replay
# stack rescues thin cloning, so the RL stages always run.
# Readout: largest k with held-out >= 0.90 across the dial9/dial7/dial5 arms (plan E-b).
# Run: `just run-file configs/tier2_single_dial9.toml`

[run]
levels          = ["tier2_single/train"]
eval_levels     = ["tier2_single/eval"]
seed            = 0
device          = "cuda" # force cuda
autodiscovery   = 9      # thin cloning: 22 effective BC epochs

[run.model]
d_model         = 256
nhead           = 8
encoder_layers  = 3
decoder_layers  = 3
dim_feedforward = 1024

[[stage]]
name                = "bc"
kind                = "pretrain"
epochs              = 200  # autodiscovery=9 scales this to 22
lr                  = 1e-4 # validated m256 BC step
batch_size          = 32
augment             = true
max_variants        = 16
eval_interval       = 5
early_stop_loss     = 0.5  # prevent overfit

[[stage]]
name                = "rl-shape"
kind                = "rl"
iterations          = 400
episodes            = 32
lr                  = 1e-4
entropy_coef        = 0.005
shaping_weight      = 0.5 # delivery-fraction shaping on unsolved COMPLETED
progress_weight     = 0.3

[[stage]]
name                = "rl-consolidate"
kind                = "rl"
iterations          = 3000        # ceiling, not target
episodes            = 32
lr                  = 1e-4
entropy_coef        = 0.001
shaping_weight      = 0.0         # solve reward only
sil_coef            = 0.4
sil_batch_size      = 32
sil_weighting       = "stratify"
sil_label           = "ring"      # half the replay from non-`arm` (length-rare) solves
eval_patience       = 40          # ~400 iterations without eval-bank improvement ends the stage
# alpha/beta/gamma stay 0, epsilon 0, temperature 1
