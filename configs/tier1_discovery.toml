# Tier-1 canonical discovery run: the validated recipe as a single clean pipeline.
#
# Stack (see TIER1_DISCOVERY_TEST.md stages 4-5):
#   small BC bootstrap (autodiscovery 9 -> 11 epochs) + strong stratified
#   self-imitation (coef 0.4, batch 32, half the minibatch from the rare class)
#   + delivery/progress shaping for stability. No eps-exploration (stage-4
#   finding: token noise only degrades the working mode).
#
# Expected ballparks from the validating run (seed 0):
#   eval-bank best ~0.66, d1 eval 17-20/34, d2 eval ~0.67-0.71, greedy train ~0.83.
#
# Manual validation:
#   just gen-tier1                                          # idempotent bank regen
#   uv run opus-magnum-blackbox run configs/tier1_discovery.toml
#   uv run opus-magnum-blackbox eval runs/<run-dir>/best_eval.pt --level tier1_simple_arms/eval
#   ... --level tier1_simple_arms/train                     # both should be near the ballparks
# Watch in metrics.jsonl: eval_solve_rate rising past the BC plateau (~0.29),
# sil_buffer growth (self-solved coverage), and greedy_solve_rate tracking eval.

[run]
levels          = ["tier1_simple_arms/train"]
eval_levels     = ["tier1_simple_arms/eval"]
seed            = 0
device          = "cuda" # force cuda
autodiscovery   = 9

[[stage]]
name            = "bc"
kind            = "pretrain"
epochs          = 100 # dial scales this to 11
lr              = 1e-3
batch_size      = 32
augment         = true
max_variants    = 16
eval_interval   = 5
early_stop_loss = 0.5

[[stage]]
name            = "rl-shape"
kind            = "rl"
iterations      = 400
episodes        = 32
lr              = 1e-4
entropy_coef    = 0.005
shaping_weight  = 0.5
progress_weight = 0.3
sil_coef        = 0.4
sil_batch_size  = 32
sil_stratify    = true

[[stage]]
name            = "rl-consolidate"
kind            = "rl"
iterations      = 2000 # ceiling, not target
episodes        = 32
lr              = 1e-4
entropy_coef    = 0.001
shaping_weight  = 0.0
progress_weight = 0.3
sil_coef        = 0.4
sil_batch_size  = 32
sil_stratify    = true
eval_patience   = 20 # ~200 iterations without eval-bank improvement ends the stage
# alpha/beta/gamma stay 0
