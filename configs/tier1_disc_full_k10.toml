# Tier-1 discovery test, matrix run 5/5: FULL combo at k=10 (pure-discovery endpoint).
# Same ingredients as tier1_disc_full.toml, but autodiscovery 10 zeroes the bc stage
# entirely: the run is pure RL discovery, no supervision at all.
# Plan: .opencode/plan/tier1_discovery_test.md, stage 4.

[run]
levels          = ["tier1_simple_arms/train"]
eval_levels     = ["tier1_simple_arms/eval"]
seed            = 0
device          = "cuda" # force cuda
autodiscovery   = 10

[[stage]]
name                = "bc"
kind                = "pretrain"
epochs              = 100 # scaled by the dial to 0: stage is skipped
lr                  = 1e-3
batch_size          = 32
augment             = true
max_variants        = 16
eval_interval       = 5
early_stop_loss     = 0.5 # prevent overfit

[[stage]]
name            = "rl-shape"
kind            = "rl"
iterations      = 400
episodes        = 32
lr              = 1e-4
entropy_coef    = 0.005
shaping_weight  = 0.5         # delivery-fraction shaping on unsolved COMPLETED
progress_weight = 0.3         # discovery: terminal bonus for atoms ending closer to the exit
explore_epsilon = 0.05        # discovery: per-step mask-uniform sampling
sil_coef        = 0.1         # discovery: BC amplification of the agent's own solves

[[stage]]
name            = "rl-consolidate"
kind            = "rl"
iterations      = 2000 # ceiling, not target
episodes        = 32
lr              = 1e-4
entropy_coef    = 0.001
shaping_weight  = 0.0         # delivered-fraction shaping stays a rl-shape-only aid
progress_weight = 0.3         # discovery ingredients stay on: the escape must survive consolidation
explore_epsilon = 0.05
sil_coef        = 0.1
eval_patience   = 20          # ~200 iterations without eval-bank improvement ends the stage
# alpha/beta/gamma stay 0
