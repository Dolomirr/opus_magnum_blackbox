# Tier-2 curriculum split, round 2 stage R1: extend the round-1 single-arm run.
# Continues RL from round-1 stage A's best checkpoint (eval 0.427, patience-stopped
# while the trajectory was still improving): autodiscovery=10 scales the BC stage to
# zero epochs, so init_from is the only initialization — the continue-RL pattern.
# rl-shape is unchanged; rl-consolidate doubles the patience (40 evals ~400 iterations)
# and raises the iteration ceiling to 3000 to let the eval trajectory run out.
# Run: `just run-file configs/tier2_single_ext.toml`

[run]
levels          = ["tier2_single/train"]
eval_levels     = ["tier2_single/eval"]
seed            = 0
device          = "cuda" # force cuda
autodiscovery   = 10     # BC skipped: pure continue-RL from the warm start
# Warm start: round-1 stage A best checkpoint (eval 0.427 @ iter 1300).
init_from       = "runs/20261115-213832-837642-tier2_single_train-tier2_single-ad5-lr0001-ent005-sh5-pg3-ent001-sil4-silb32-silwstratify-sillring/best_eval.pt"

[[stage]]
name                = "rl-shape"
kind                = "rl"
iterations          = 400
episodes            = 32
lr                  = 1e-4
entropy_coef        = 0.005
shaping_weight      = 0.5 # delivery-fraction shaping on unsolved COMPLETED
progress_weight     = 0.3

[[stage]]
name                = "rl-consolidate"
kind                = "rl"
iterations          = 3000        # ceiling, not target
episodes            = 32
lr                  = 1e-4
entropy_coef        = 0.001
shaping_weight      = 0.0         # solve reward only
sil_coef            = 0.4
sil_batch_size      = 32
sil_weighting       = "stratify"
sil_label           = "ring"      # half the replay from non-`arm` (length-rare) solves
eval_patience       = 40          # ~400 iterations without eval-bank improvement ends the stage
# alpha/beta/gamma stay 0, epsilon 0, temperature 1
